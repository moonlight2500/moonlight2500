# mode 는 5가지 중 하나:
#   web    - 화면으로 지켜보며 신호만 확인 (주문 없음)
#   replay - 과거 데이터를 그대로 재생하며 검증
#   paper  - 실시간 시세로 모의 주문 (실제 체결 없음)
#   live   - 실제 계좌로 실주문 (원칙 11: 이 엔진은 항상 하나뿐)
#   sim    - 가상 시나리오로 극단 상황 테스트
mode: sim

