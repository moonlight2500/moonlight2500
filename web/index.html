<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AutoDayTrading</title>
<link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>

<!-- ★ 로그인 전에는 이 화면만 보인다(app.js 가 #app-root 를 감췄다 켠다).
     비밀번호 없이 API 를 그대로 두면 외부(Tailscale 등)에서 누구든
     계좌를 조작할 수 있어 추가한 최소한의 잠금 화면이다. -->
<div id="login-overlay" class="login-overlay" style="display:none">
  <form id="login-form" class="card login-box">
    <div class="login-title">🔒 AutoDayTrading</div>
    <div class="hint">비밀번호(숫자 6자리)를 입력하세요.</div>
    <input id="login-password" type="password" inputmode="numeric" pattern="[0-9]*"
           maxlength="6" autocomplete="current-password" autofocus />
    <button type="submit" class="b">확인</button>
    <div id="login-error" class="hint fall" style="display:none"></div>
  </form>
  <!-- ★ 처음 보는 IP·기기면 비밀번호가 맞아도 바로 못 들어간다 - 서버 PC의 /admin 에서
       승인해야 한다(devices.py). 대기하는 동안 로그인 폼 대신 이 안내가 보인다. -->
  <div id="login-wait" class="card login-box" style="display:none">
    <div class="login-title">🔐 새 기기 승인 대기 중</div>
    <div class="hint">이 프로그램이 켜진 PC의 브라우저에서 승인해야 접속할 수 있습니다. 승인되면 자동으로 넘어갑니다.</div>
    <div id="login-wait-msg" class="hint fall" style="display:none"></div>
  </div>
</div>

<!-- ★ 로그인 세션이 있어도 민감한 동작(설정 메뉴 진입, 자동매매 시작/정지)
     전에는 한 번 더 확인한다 - 자리를 비운 사이 잠금 안 된 화면을 다른
     사람이 주웠을 때의 방어선이다. app.js 의 confirmPassword() 가 제목·
     안내문을 상황에 맞게 바꿔서 이 모달 하나를 재사용한다. -->
<div id="settings-guard-overlay" class="login-overlay" style="display:none">
  <form id="settings-guard-form" class="card login-box">
    <div class="login-title" id="settings-guard-title">🔒 확인</div>
    <div class="hint" id="settings-guard-hint">계속하려면 비밀번호를 다시 입력하세요.</div>
    <input id="settings-guard-password" type="password" inputmode="numeric" pattern="[0-9]*"
           maxlength="6" autocomplete="current-password" />
    <button type="submit" class="b">확인</button>
    <button type="button" class="b ghost" id="settings-guard-cancel">취소</button>
    <div id="settings-guard-error" class="hint fall" style="display:none"></div>
  </form>
</div>

<div id="app-root" style="display:none">
<!-- ★★★ 내비게이션 재설계 - "많은 스크롤로 보기 불편한 네비게이션 지양"
     요청에 따라, 예전의 "그룹 탭 + 하위 탭" 두 줄 구조를 데스크톱/태블릿
     에서는 왼쪽 사이드바(16개 화면을 전부 펼쳐 두어 어디든 한 번에)로,
     모바일에서는 하단 고정 탭바(그룹 4개) + 그 위 가로로 미는 하위 탭
     칩 한 줄로 바꾼다. .sub-nav/.group-nav/#band 같은 기존 클래스·id 는
     app.js 의 다른 코드가 그대로 참조하므로 이름은 그대로 두고 배치만
     새로 짠다(app.js 의 renderSidebarNav 등이 내용을 채운다). -->
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
    <div class="sidebar-head">
      <button type="button" class="sidebar-collapse" id="sidebar-collapse"
              title="메뉴 접기/펼치기" aria-label="메뉴 접기/펼치기" aria-expanded="true"></button>
      <div class="sidebar-brand">
        <span class="sidebar-brand-logo" aria-hidden="true"></span>
        <span class="sidebar-brand-name">AutoDayTrading</span>
      </div>
    </div>
    <!-- ★ "대기가 뭘 의미하는거야?" - app.js 의 updateBand() 가 실제 상태에 맞춰
         라벨·title·aria-label 을 매번 새로 채운다(여기 값은 그 전까지의 자리표시자). -->
    <span class="sidebar-mode-badge" id="sidebar-mode-badge" data-state="idle" tabindex="0" role="button"
          title="자동매매 상태 - 서버와 연결을 확인하는 중입니다." aria-label="자동매매 상태: 연결 확인 중">
      <span class="sidebar-mode-badge-label">연결 확인 중</span>
    </span>
    <nav class="sidebar-nav" id="sidebar-nav" aria-label="화면 목록"></nav>
  </aside>

  <div class="main-col">
    <!-- ★★ 상단바와 하위 탭 칩을 한 상자로 감싼다 - 따로 두고 각자
         sticky 를 주면 겹치는 문제가 생긴다(예전 밴드+메뉴 버그와 같은
         이유). -->
    <div class="stickytop">
      <header class="topbar">
        <h1 class="topbar-title" id="topbar-title">대시보드</h1>
        <div class="topbar-actions">
          <span class="band" id="band" data-state="idle">
            <span class="band-title" id="band-title">연결 중...</span>
          </span>
          <button id="currency-toggle" type="button" title="해외주식 금액 표시 통화 전환" aria-label="해외주식 금액 표시 통화 전환" style="display:none">$</button>
          <button id="theme-toggle" type="button" title="화면 밝기 전환" aria-label="화면 밝기 전환"></button>
          <span id="conn-indicator" data-mode="connecting" title="프로그램 연결 중"></span>
          <span id="app-version" class="hint" style="display:none"></span>
        </div>
      </header>
      <nav class="sub-nav" id="sub-nav" aria-label="현재 그룹의 화면"></nav>
    </div>

    <main>
      <section class="panel" data-panel="dash"></section>
      <section class="panel" data-panel="selection"></section>
      <section class="panel" data-panel="news"></section>
      <section class="panel" data-panel="market"></section>
      <section class="panel" data-panel="perf"></section>
      <section class="panel" data-panel="journal"></section>
      <section class="panel" data-panel="marketreview"></section>
      <section class="panel" data-panel="about"></section>
      <section class="panel" data-panel="review"></section>
      <section class="panel" data-panel="lab"></section>
      <section class="panel" data-panel="playbook"></section>
      <section class="panel" data-panel="rules"></section>
      <section class="panel" data-panel="release"></section>
      <section class="panel" data-panel="setup"></section>
      <section class="panel" data-panel="themes"></section>
      <section class="panel" data-panel="config"></section>
    </main>

    <!-- 모바일 전용 하단 탭바(그룹 4개) - 768px 이상에서는 CSS 가 숨긴다. -->
    <nav class="group-nav" id="group-nav" aria-label="주 메뉴"></nav>
  </div>
</div>
</div>

<!-- 순서 고정: ui.js → chart.js → forms.js → app.js.
     app.js 가 window.UI 를 구조분해로 꺼내므로 반드시 마지막이어야 한다.
     ?v= 캐시 무력화 쿼리는 서버가 파일 수정 시각으로 바꿔서 내려준다. -->
<script src="/static/ui.js?v=1"></script>
<script src="/static/chart.js?v=1"></script>
<script src="/static/forms.js?v=1"></script>
<script src="/static/app.js?v=1"></script>
</body>
</html>
